# Build Windows and macOS binaries; attach to GitHub Release when a release is published.
# Also runnable manually (workflow_dispatch) - artifacts will be in the workflow run.

name: Build Windows and macOS (Electrum WojakCoin)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional: tag of release to attach macOS build to (e.g. v4.7.1-wojak)'
        required: false

jobs:
  build-windows:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 0

      - name: Build Windows binaries
        run: ./contrib/build-wine/build.sh

      - name: Upload artifacts to workflow
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-${{ github.run_number }}
          path: |
            contrib/build-wine/dist/*.exe
            contrib/build-wine/dist/*.zip
            contrib/build-wine/dist/electrum/

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            contrib/build-wine/dist/*.exe
            contrib/build-wine/dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-14
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 0

      - name: Build macOS binary
        env:
          PACKAGE: Electrum-WojakCoin
        run: ./contrib/osx/make_osx.sh

      - name: Upload artifacts to workflow
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-${{ github.run_number }}
          path: |
            dist/*.dmg
            dist/*.app

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS to existing Release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          RELEASE_ID=$(curl -sS -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github.v3+json" "https://api.github.com/repos/${{ github.repository }}/releases/tags/$RELEASE_TAG" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          for f in dist/*.dmg; do
            [ -f "$f" ] && curl -sS -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Content-Type: application/octet-stream" --data-binary "@$f" "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=$(basename "$f")"
          done
